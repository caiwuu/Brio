[project]
name = "brio-py"
version = "0.1.0"
description = "Brio Tauri sidecar"
requires-python = ">=3.12"
# 纯标准库实现（urllib / socket / threading），无第三方运行时依赖。
dependencies = []

[project.scripts]
brio-py = "brio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brio"]
