[project]
name = "brio"
version = "0.1.0"
description = "Brio：指纹浏览器桌面端（macOS / Windows）的根目录 Python 工具配置（sidecar 包见 python/）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.8",
    "playwright>=1.58.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.12.5",
    "pytz>=2025.2",
    "toolcall-gateway>=1.0.0",
    "uvicorn[standard]>=0.40.0",
    "python-multipart>=0.0.26",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["python/tests"]

[tool.pyright]
include = ["python"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".venv-sidecar",
    ".pyinstaller-build",
    ".pyinstaller-dist",
    "node_modules",
    "src-tauri/target",
    "brower",
]
extraPaths = ["python"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.basedpyright]
include = ["python"]
exclude = [
    "**/__pycache__",
    ".venv",
    ".venv-sidecar",
    ".pyinstaller-build",
    ".pyinstaller-dist",
    "node_modules",
    "src-tauri/target",
    "brower",
]
extraPaths = ["python"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
