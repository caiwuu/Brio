[package]
name = "brio-desktop"
version = "0.1.0"
description = "Brio Tauri Desktop"
authors = ["caiwu"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "brio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }
once_cell = "1.20"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
ulid = "1.1"
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
